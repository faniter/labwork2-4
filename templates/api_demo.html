{% extends "base.html" %}
{% block title %}API Demo - Відгуки{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6 text-center">API Demo - Управління відгуками</h1>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Форма додавання відгуку -->
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-gray-900">➕ Додати новий відгук</h2>
        <form id="feedback-form" class="space-y-4">
            <div>
                <label for="user_name" class="block text-gray-700 font-bold mb-2">Ваше ім'я:</label>
                <input type="text" name="user_name" id="user_name" 
                       class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" 
                       required>
            </div>
            
            <div>
                <label for="email" class="block text-gray-700 font-bold mb-2">Ваш Email:</label>
                <input type="email" name="email" id="email" 
                       class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" 
                       required>
            </div>
            
            <div>
                <label for="message" class="block text-gray-700 font-bold mb-2">Повідомлення:</label>
                <textarea name="message" id="message" rows="5" 
                          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" 
                          required></textarea>
            </div>
            
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-400 to-cyan-400 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-2 px-4 rounded-lg transition duration-300 shadow-md hover:shadow-lg">
                📤 Надіслати відгук
            </button>
        </form>

        <!-- Повідомлення про статус -->
        <div id="form-message" class="mt-4 hidden"></div>
    </div>

    <!-- Список відгуків з API -->
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-gray-900">📋 Список відгуків з API</h2>
        <button onclick="loadFeedback()" 
                class="mb-4 bg-gradient-to-r from-blue-400 to-cyan-400 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-2 px-4 rounded-lg transition duration-300 shadow-md hover:shadow-lg">
            🔄 Оновити список
        </button>
        <div id="feedback-list" class="space-y-4 max-h-96 overflow-y-auto">
            <div class="text-center text-gray-500">
                <div class="animate-pulse">⏳ Завантаження відгуків...</div>
            </div>
        </div>
        <div id="feedback-count" class="mt-4 text-sm text-gray-600 font-bold"></div>
    </div>
</div>

<script>
    // Завантаження відгуків з API
    async function loadFeedback() {
        const feedbackList = document.getElementById('feedback-list');
        feedbackList.innerHTML = '<div class="text-center text-gray-500 animate-pulse">⏳ Завантаження...</div>';
        
        try {
            const response = await fetch('/api/feedback');
            if (!response.ok) {
                throw new Error(`HTTP помилка! Статус: ${response.status}`);
            }
            const feedbacks = await response.json();
            
            const countElement = document.getElementById('feedback-count');
            countElement.textContent = `Всього відгуків: ${feedbacks.length}`;
            
            if (feedbacks.length === 0) {
                feedbackList.innerHTML = '<p class="text-gray-500 text-center">📭 Відгуків поки немає. Будьте першим!</p>';
                return;
            }
            
            feedbackList.innerHTML = feedbacks.map((feedback, index) => `
                <div class="border-l-4 border-blue-400 pl-4 py-3 bg-gradient-to-r from-blue-50 to-white rounded hover:shadow-md transition duration-300">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-lg text-gray-800">👤 ${escapeHtml(feedback.user_name)}</h3>
                        <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">#${feedback.id}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">📧 ${escapeHtml(feedback.email)}</p>
                    <p class="text-gray-700 mb-2">${escapeHtml(feedback.message)}</p>
                    <p class="text-xs text-gray-400">🕐 ${formatDate(feedback.created_at)}</p>
                </div>
            `).join('');
        } catch (error) {
            feedbackList.innerHTML = 
                `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                    <strong>❌ Помилка завантаження:</strong> ${error.message}
                </div>`;
            document.getElementById('feedback-count').textContent = '';
        }
    }
    
    // Відправка форми через API
    document.getElementById('feedback-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const messageDiv = document.getElementById('form-message');
        
        // Показуємо статус відправки
        messageDiv.className = 'mt-4 bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded';
        messageDiv.textContent = '⏳ Відправляємо...';
        messageDiv.classList.remove('hidden');
        
        try {
            const response = await fetch('/api/feedback', {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                // Успіх
                messageDiv.className = 'mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded animate-slide-down';
                messageDiv.innerHTML = '<strong>✅ Успіх!</strong> Ваш відгук успішно додано.';
                
                // Очистити форму
                e.target.reset();
                
                // Оновити список
                setTimeout(() => {
                    loadFeedback();
                }, 500);
                
                // Сховати повідомлення через 5 секунд
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 5000);
            } else {
                throw new Error(`Помилка сервера: ${response.status}`);
            }
        } catch (error) {
            // Помилка
            messageDiv.className = 'mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded animate-slide-down';
            messageDiv.innerHTML = `<strong>❌ Помилка!</strong> ${error.message}`;
        }
    });
    
    // Екранування HTML для безпеки
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Форматування дати
    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('uk-UA', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
    
    // Завантажуємо відгуки при завантаженні сторінки
    loadFeedback();
</script>
{% endblock %}
