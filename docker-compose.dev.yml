
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_app_dev
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_PATH=/app/db.sqlite
      - SECRET_KEY=dev-secret-key
    volumes:
      - .:/app
      - sqlite_data:/app
    command: python -m flask run --host=0.0.0.0 --port=5000 --reload

volumes:
  sqlite_data:
    driver: local
